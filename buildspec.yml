version: 0.2

phases:
  pre_build:
    commands:
    - echo Logging in to Docker Hub...
    # SECURITY FIX: Use the environment variable, not the plain-text password
    - docker login --username socialnexasi --password $DOCKERHUB_PASS
    - echo Logging in to Amazon ECR...
    - aws --version
    - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 485788481896.dkr.ecr.us-east-2.amazonaws.com
    - REPOSITORY_URI=485788481896.dkr.ecr.us-east-2.amazonaws.com/keycloak-dotstow-prod
    - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

  build:
    commands:
    - echo Build started on `date`
    - echo Building the Docker image...
    - mvn package -Dmaven.test.skip=true
    # FIX: Build directly to the specific tag, completely ignoring :latest
    - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
    - echo Build completed on `date`
    - echo Pushing the Docker image...
    # FIX: Push only the specific tag
    - docker push $REPOSITORY_URI:$IMAGE_TAG
    - echo Writing image definitions file...
    # CRITICAL FIX: Matched the name exactly to your ECS Task Definition
    - printf '[{"name":"keycloak-dotstow-prod","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
    
cache:
  paths:
    - '/root/.m2/**/*'
